[project]
name = "video-workbench"
version = "0.1.0"
description = "Video Workbench: a chat-based video editor built as a general agent harness (v0 slice: Clip + Resize)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # core
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "numpy>=2.0",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "filelock>=3.16",
    # model gateway and agent hosts
    "openai>=2.0",
    "google-genai>=1.40",
    "claude-agent-sdk>=0.1.30",
    "mcp>=1.20",
    "websockets>=15,<17",          # private browser stream relay
    # edit index (Apple Silicon local stack)
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "scenedetect>=0.6.5",
    "rapidocr>=3.0",
    "onnxruntime>=1.20",
    "pyobjc-framework-Vision>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "vtracer>=0.6.15",
]

[project.scripts]
vwb = "vwb.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vwb"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741"]   # `l` is the house name for a canvas layer

[tool.pytest.ini_options]
testpaths = ["tests"]
