# The policy dial (spec D04): one mode per capability.
#   allow  - run it
#   flag   - run it and record a flag
#   ask    - raise a human.ask card; park that call, never the request
#   block  - refuse
#
# The spec starts general because agents run inside a microVM. This build runs on a local
# machine with no microVM, so capabilities that need one start at "block". Each row tightens
# or loosens with a one-line edit.

mode: local   # local | microvm

capabilities:
  # agents act only through typed toolkit calls in local mode
  shell.exec: block                 # raw bash for agents (needs the microVM)
  code.run: block                   # agent-written scripts: qc.script, generator.register
  fs.write_outside_workspace: block
  host.codex: allow                 # Codex workers, each in its own Docker container (the agent plane); the
                                    # container mounts only work/ and reaches keys and tools through the gateways

  # model and media work through the gateway
  model.call: allow
  watch: allow
  index.build: allow
  render: allow
  canvas.commit: allow              # role check still applies: job lead only
  human.ask: allow
  agent.manage: allow             # supervised, permission-inheriting subagents; bounded tree per turn
  artifact.publish: allow         # request-local HTML artifacts and explicit review selections
  media.inspect: allow            # bounded image crop/zoom, with source coordinate mapping
  document.read: allow            # bounded PDF examination and durable chat file inspection/memory
  sandbox.run: allow              # Docker only; code.run stays blocked on the host
  sandbox.network: allow          # opt-in public HTTP(S) proxy; no private/host destinations or vendor keys
  sandbox.environment: allow      # reusable virtual environments/packages inside request work/
  sandbox.status: allow           # observe/cancel bounded background sandbox jobs

  # asset lab
  asset.recover.pixels: allow       # rungs 0-1 (original and fused pixels)
  asset.recover.generative: allow   # rungs 3-5 (image-model split, tracing, keyed motion)
  gen.image: allow                  # sunburst: create, extract, inpaint, outpaint (flags follow the asset)
  gen.video: allow                  # Omni clips and keyed motion (flags follow the asset)
  sam3.on_marks: ask

  # read-only web scouts; remote search/fetch run through the host gateway
  web.search: allow
  web.fetch: allow
  web.research: allow               # combined search/fetch also requires both rows above to allow
  asset.fetch: allow                # into quarantine/ only
  browser.observe: allow           # shared browser accessibility + viewport evidence
  browser.control: allow           # typed actions in an isolated browser; human ownership wins
  browser.files: allow             # bounded explicit workspace uploads/downloads, logged through Registry
  integration.read: allow          # enabled reads via direct MCP servers or provider presets
  integration.execute: allow       # direct MCP tools explicitly enabled in the human connection manager

roles:
  # Which tools each role may call. "*" means every tool not listed under deny.
  job_lead:
    allow: ["*"]
    deny: []
  worker:                         # general helper; intersects its parent's effective permissions
    allow: ["*"]
    deny: [canvas_commit]
  scene_miner:      # Gemini, watches the source natively
    allow: [agent_spawn, agent_list, agent_send, agent_inbox, agent_wait, agent_interrupt, agent_followup,
            image_inspect, pdf_info, pdf_read, pdf_search, pdf_render, attachment_list, attachment_read, attachment_remember,
            sandbox_run, sandbox_environment, sandbox_status, artifact_publish, artifact_list, artifact_feedback,
            index_overview, index_query, index_search, index_transcript, index_shots,
            integration_status, integration_tools, integration_call,
            media_frame, media_contact_sheet, watch_ask, focus_find, memory_note,
            file_list, file_read, file_grep, file_write]
  planner_b:        # GPT-6.1-Sol, an independent plan from another family
    allow: [agent_spawn, agent_list, agent_send, agent_inbox, agent_wait, agent_interrupt, agent_followup,
            image_inspect, pdf_info, pdf_read, pdf_search, pdf_render, attachment_list, attachment_read, attachment_remember,
            sandbox_run, sandbox_environment, sandbox_status, artifact_publish, artifact_list, artifact_feedback,
            index_overview, index_query, index_search, index_transcript, index_shots,
            integration_status, integration_tools, integration_call,
            web_search, web_fetch, web_research,
            media_frame, media_contact_sheet, clip_candidates, clip_refine, clip_validate, focus_find, memory_note,
            file_list, file_read, file_grep, file_write]
  composer:         # GPT-6.1-Sol (Codex in Docker): drafts a composition; the job lead commits
    allow: [agent_spawn, agent_list, agent_send, agent_inbox, agent_wait, agent_interrupt, agent_followup,
            image_inspect, pdf_info, pdf_read, pdf_search, pdf_render, attachment_list, attachment_read, attachment_remember,
            sandbox_run, sandbox_environment, sandbox_status, artifact_publish, artifact_list, artifact_feedback,
            index_overview, index_query, index_search, index_transcript, index_shots,
            integration_status, integration_tools, integration_call,
            web_search, web_fetch, web_research,
            media_frame, media_contact_sheet, watch_ask, focus_find, reframe_solve, asset_marks, asset_view, asset_trace, chart_read, video_matte,
            sunburst_create, sunburst_extract, sunburst_inpaint, sunburst_outpaint, omni_video,
            layout_facts, canvas_schema, canvas_new, canvas_check, canvas_preview, canvas_snapshot, canvas_query, shape_kit, copy_add, copy_list,
            file_list, file_read, file_grep, file_write, file_edit, memory_note]
  critic:           # GPT-6.1-Sol, another family; checks renders, never certifies
    allow: [agent_spawn, agent_list, agent_send, agent_inbox, agent_wait, agent_interrupt, agent_followup,
            image_inspect, pdf_info, pdf_read, pdf_search, pdf_render, attachment_list, attachment_read, attachment_remember,
            sandbox_run, sandbox_environment, sandbox_status, artifact_publish, artifact_list, artifact_feedback,
            index_overview, index_transcript, index_shots, media_frame, media_contact_sheet,
            integration_status, integration_tools, integration_call,
            canvas_get, canvas_check, canvas_list, canvas_query, qc_run, qc_peek, render_info, flags_list, memory_note,
            asset_view, chart_read, output_compare, file_list, file_read, file_grep]
