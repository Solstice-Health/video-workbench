name: Workbench checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VWB_REQUIRE_FRONTEND_TESTS: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - name: Set up Node for UI checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - name: Install locked Python environment and media utilities
        run: |
          python -m pip install uv==0.11.25
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          uv sync --frozen
      - name: Check Python correctness
        run: |
          uv run --frozen ruff check src --select E9,F63,F7,F82
          uv run --frozen ruff check tests/test_frontend_distribution.py
      - name: Check shipped browser runtime without npm
        working-directory: generators/remotion
        run: node scripts/check-workbench-ui.mjs
      - name: Run backend and frontend regression tests
        run: uv run --frozen pytest -q --junitxml=reports/pytest.xml
      - name: Require frontend tests to run
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("reports/pytest.xml").getroot().iter("testcase"))
          frontend = [case for case in cases if "_frontend" in case.get("classname", "") or "frontend_distribution" in case.get("classname", "")]
          assert frontend, "No frontend interaction tests were collected."
          skipped = [case.get("name") for case in frontend if case.find("skipped") is not None]
          assert not skipped, f"Frontend tests must not silently skip: {skipped}"
          print(f"Frontend tests executed: {len(frontend)}")
          PY
      - name: Build wheel and source archive
        run: uv build --wheel --sdist
      - name: Smoke test packaged backend and frontend outside the checkout
        run: uv run --frozen python scripts/smoke_distribution.py dist/*.whl --frontend-test tests/test_frontend_distribution.py
      - name: Keep test reports and distributable packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workbench-checks
          path: |
            reports/
            dist/
          if-no-files-found: ignore
          retention-days: 7
